name: Count Lines of Code

# Controls when the action will run. Triggers the workflow on push or pull request 
# events but only for the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  cloc:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    # Runs djdefi/cloc-action@main
    - name: Count Lines of Code (cloc)
      uses: djdefi/cloc-action@4f31c3e25371ff21880fa77aeb0925ce6fc0891b # main
    
    - name: Count Lines of Code with additional options
      uses: djdefi/cloc-action@4f31c3e25371ff21880fa77aeb0925ce6fc0891b # main
      with:
          options: --exclude-lang=YAML --md --report-file=cloc.md
    
    - name: Output report .md
      run: |
        cat cloc.md
