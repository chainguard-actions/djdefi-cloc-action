name: Test --json option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove any stale cloc.txt
        run: rm -f "$GITHUB_WORKSPACE/cloc.txt"
      - id: action
        uses: .
        with:
          options: --json --quiet
      - name: Assert JSON output
        run: |
          f="$GITHUB_WORKSPACE/cloc.txt"
          if [ ! -f "$f" ]; then
            echo "FAIL: cloc.txt not created"
            exit 1
          fi
          cat "$f"
          if ! grep -q '"header"' "$f"; then
            echo "FAIL: expected JSON 'header' key"
            exit 1
          fi
          if ! grep -q '"SUM"' "$f"; then
            echo "FAIL: expected JSON 'SUM' key"
            exit 1
          fi
          if command -v python3 >/dev/null 2>&1; then
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert 'SUM' in d and d['SUM']['nFiles']>0" "$f" || { echo "FAIL: invalid JSON or no files counted"; exit 1; }
          fi
          echo "PASS"
