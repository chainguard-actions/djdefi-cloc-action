name: Test --md option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove any stale cloc.txt
        run: rm -f "$GITHUB_WORKSPACE/cloc.txt"
      - id: action
        uses: .
        with:
          options: --md
      - name: Assert markdown table output
        run: |
          f="$GITHUB_WORKSPACE/cloc.txt"
          if [ ! -f "$f" ]; then
            echo "FAIL: cloc.txt not created"
            exit 1
          fi
          cat "$f"
          if ! grep -q "^Language|files|blank|comment|code" "$f"; then
            echo "FAIL: expected markdown header row"
            exit 1
          fi
          if ! grep -q ":-------" "$f"; then
            echo "FAIL: expected markdown separator row"
            exit 1
          fi
          echo "PASS"
