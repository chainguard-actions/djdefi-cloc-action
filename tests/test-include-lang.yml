name: Test cloc with --include-lang option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: cloc
        uses: .
        with:
          options: '--include-lang=Bourne Shell'

      - name: Assert cloc output file was created
        run: |
          if [ ! -f cloc.txt ]; then
            echo "FAIL: cloc.txt was not created"
            exit 1
          fi
          echo "PASS: cloc.txt exists"
          cat cloc.txt

      - name: Assert cloc ran successfully and produced output
        run: |
          # cloc should produce some output (even if no matching files, it shows a header or zero-count)
          if [ ! -s cloc.txt ]; then
            echo "FAIL: cloc.txt is empty"
            exit 1
          fi
          echo "PASS: cloc.txt has content"
          cat cloc.txt
