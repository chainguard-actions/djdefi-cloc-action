name: Test cloc with include-lang option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run cloc filtering by YAML language
        id: cloc
        uses: .
        with:
          options: '--include-lang=YAML'
      - name: Assert cloc ran successfully with include-lang option
        run: |
          echo "cloc step with --include-lang=YAML option completed successfully"
          echo "PASS"
