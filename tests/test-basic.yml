name: Test basic cloc usage (no options)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run cloc action with no options
        id: cloc
        uses: .

      - name: Assert cloc ran successfully
        run: |
          echo "Checking cloc.txt was created..."
          if [ ! -f cloc.txt ]; then
            echo "FAIL: cloc.txt was not created"
            exit 1
          fi
          echo "Contents of cloc.txt:"
          cat cloc.txt
          # cloc output should contain header lines
          if ! grep -q "cloc" cloc.txt 2>/dev/null && ! grep -qi "language" cloc.txt 2>/dev/null; then
            echo "FAIL: cloc.txt does not appear to contain cloc output"
            exit 1
          fi
          echo "PASS: cloc ran successfully and produced output"
