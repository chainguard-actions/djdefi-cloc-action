name: Test basic cloc usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run cloc action
        id: cloc
        uses: .
      - name: Assert cloc.txt was created
        run: |
          echo "Checking for cloc.txt..."
          if [ ! -f cloc.txt ]; then
            echo "FAIL: cloc.txt was not created"
            exit 1
          fi
          echo "PASS: cloc.txt exists"
          echo "--- cloc.txt contents ---"
          cat cloc.txt
      - name: Assert cloc.txt has content
        run: |
          LINES=$(wc -l < cloc.txt)
          echo "cloc.txt has $LINES lines"
          if [ "$LINES" -lt 2 ]; then
            echo "FAIL: cloc.txt appears to be empty or too short"
            exit 1
          fi
          echo "PASS: cloc.txt has content"
      - name: Assert cloc output contains expected headers
        run: |
          echo "Checking cloc output for expected content..."
          if ! grep -qi "language" cloc.txt && ! grep -qi "SUM" cloc.txt && ! grep -qi "files" cloc.txt; then
            echo "FAIL: cloc.txt does not contain expected cloc output headers"
            cat cloc.txt
            exit 1
          fi
          echo "PASS: cloc output looks valid"
