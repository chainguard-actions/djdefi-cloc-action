name: Test basic cloc usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run cloc action
        uses: .

      - name: Assert cloc output file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/cloc.txt" ]; then
            echo "FAIL: cloc.txt was not created"
            exit 1
          fi
          echo "PASS: cloc.txt exists"
          cat "$GITHUB_WORKSPACE/cloc.txt"

      - name: Assert cloc output contains expected sections
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/cloc.txt")
          echo "cloc output:"
          echo "$CONTENT"
          # cloc output should contain a header line or language stats
          if ! echo "$CONTENT" | grep -qiE '(Language|files|lines|SUM|cloc)'; then
            echo "FAIL: cloc.txt does not contain expected cloc output"
            exit 1
          fi
          echo "PASS: cloc.txt contains expected cloc output"
