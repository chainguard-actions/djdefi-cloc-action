name: Test cloc with additional options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run cloc with --by-file option
        id: cloc
        uses: .
        with:
          options: '--by-file'
      - name: Assert cloc ran successfully with options
        run: |
          echo "cloc step with --by-file option completed successfully"
          echo "PASS"
